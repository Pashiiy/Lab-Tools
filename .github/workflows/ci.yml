name: CI

# Non-release validation only. Runs on branch pushes / PRs.
# This workflow MUST NOT package installers, sign apps, upload DMGs,
# or create GitHub Releases — that is exclusively release.yml's job.
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      # Pin npm to the exact version declared in package.json "packageManager"
      # (the version that generated package-lock.json). Node 22.13 ships npm 10.x,
      # whose resolver disagrees with the npm 11 lockfile and causes the
      # @emnapi/* "missing from lock file" npm ci failures.
      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"
          npm -v

      - name: Install dependencies (npm ci — strict, lockfile-pinned)
        run: npm ci
        env:
          HUSKY: '0'

      - name: Validate lockfile is in sync
        run: npm run validate:lock

      # Non-blocking for now: the codebase has pre-existing lint errors.
      # Remove `continue-on-error` to make lint a hard gate once they're fixed.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build renderer (no packaging)
        run: npm run build

  # Cross-platform colony sidecar venv paths (Scripts/ on Windows, bin/ on Unix).
  # Path resolution lives in electron/colonyVenv.cjs — shared by setup:colony,
  # Electron spawn, and verify:colony-venv. Do not hardcode bin/ or Scripts/ here.
  colony-venv:
    name: Colony venv (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: '0'

      # Uses electron/colonyVenv.cjs (process.platform → bin/ vs Scripts/) for
      # clean .venv create, pip install, and sidecar /health — same helper as
      # local npm run setup:colony and Electron spawn.
      - name: Verify colony venv + sidecar
        run: npm run verify:colony-venv

  # Freeze the packaged sidecar (PyInstaller). Dev still uses colony-venv above.
  colony-freeze:
    name: Colony freeze (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Freeze colony_counter_service
        run: npm run build:colony-backend

      - name: Smoke-test frozen binary (/health)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/backend/colony_counter/dist-bin"
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            EXE="$ROOT/win-x64/colony_counter_service/colony_counter_service.exe"
            [[ -f "$EXE" ]] || EXE="$ROOT/win-x64/colony_counter_service.exe"
          else
            ARCH="$(uname -m)"
            if [[ "$ARCH" == "arm64" ]]; then
              KEY=mac-arm64
            else
              KEY=mac-x64
            fi
            EXE="$ROOT/$KEY/colony_counter_service/colony_counter_service"
            [[ -x "$EXE" ]] || EXE="$ROOT/$KEY/colony_counter_service"
          fi
          test -e "$EXE"
          PORT=18765
          "$EXE" --host 127.0.0.1 --port "$PORT" --log-level warning &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -sf "http://127.0.0.1:$PORT/health" | grep -q ok; then
              echo "OK: frozen sidecar healthy ($EXE)"
              exit 0
            fi
            sleep 1
          done
          echo "FAIL: frozen sidecar did not become healthy"
          exit 1

  # Catch the release-yml Windows failure mode: gitignored icons + electron-builder
  # invoked without npm predist:* — generate icons, then build NSIS.
  win-installer:
    name: Windows NSIS (icons + pack)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"

      - name: Install npm dependencies
        run: npm ci
        env:
          HUSKY: '0'

      - name: Build renderer (Vite)
        run: npm run build

      - name: Freeze Colony Auto Count sidecar
        run: npm run build:colony-backend

      - name: Generate platform icons
        run: npm run generate-icons

      - name: Confirm public/icon.ico exists
        shell: bash
        run: |
          set -euo pipefail
          ls -la public/
          test -f public/icon.ico
          node -e "const fs=require('fs'); console.log('icon.ico', fs.statSync('public/icon.ico').size)"

      - name: Package Windows NSIS installer
        run: npx electron-builder --win --publish never

      - name: Verify installer artifact
        shell: bash
        run: npm run verify:win

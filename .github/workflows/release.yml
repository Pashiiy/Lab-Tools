name: Release

# SINGLE SOURCE OF TRUTH for releases.
# Triggered ONLY by version tags pushed via `npm run release` (scripts/release.mjs).
# This is the ONLY workflow allowed to build installers and create GitHub Releases.
#
# Produces three installers:
#   - macOS Apple Silicon (arm64) DMG
#   - macOS Intel (x64) DMG
#   - Windows NSIS (.exe)
#
# Both mac arches are built in one macos job (electron-builder cross-compiles
# x64 Electron on arm64 runners). Windows stays on windows-latest because the
# NSIS toolchain and any native deps are more reliable on a real Windows runner.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS DMG (arm64 + x64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      # Pin npm to the exact version declared in package.json "packageManager"
      # (the version that generated package-lock.json). Node 22.13 ships npm 10.x,
      # whose resolver disagrees with the npm 11 lockfile and causes the
      # @emnapi/* "missing from lock file" npm ci failures.
      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"
          npm -v

      - name: Install dependencies (npm ci — strict, lockfile-pinned)
        run: npm ci
        env:
          HUSKY: '0'

      - name: Validate lockfile is in sync
        run: npm run validate:lock

      - name: Setup Python (arm64)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: arm64

      - name: Build renderer (Vite)
        run: npm run build

      - name: Freeze Colony Auto Count sidecar (arm64)
        run: npm run build:colony-backend -- --arch arm64

      - name: Setup Python (x64 / Rosetta)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - name: Freeze Colony Auto Count sidecar (x64)
        run: npm run build:colony-backend -- --arch x64

      # Icons are gitignored — must regenerate before electron-builder (CI bypasses
      # npm run dist:mac / predist:mac by invoking electron-builder directly).
      - name: Generate platform icons
        run: npm run generate-icons

      - name: Confirm macOS icon assets exist
        run: |
          test -f public/icon.icns
          test -f public/icon.png
          ls -la public/icon.*

      - name: Package macOS DMGs (arm64 + x64, ad-hoc signed, no notarization)
        env:
          # Prevent partial signing from stray CI keychain identities.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: CSC_IDENTITY_AUTO_DISCOVERY=false npx electron-builder --mac dmg --arm64 --x64 --publish never

      - name: Verify app signatures (fails the release on a broken / missing bundle)
        run: npm run verify:mac

      - name: Upload macOS DMG artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: |
            release/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-win:
    name: Windows NSIS
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm

      # Pin npm to the exact version declared in package.json "packageManager"
      # (the version that generated package-lock.json). Node 22.13 ships npm 10.x,
      # whose resolver disagrees with the npm 11 lockfile and causes the
      # @emnapi/* "missing from lock file" npm ci failures.
      - name: Pin npm to packageManager version
        shell: bash
        run: |
          NPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm i -g "npm@${NPM_VERSION}"
          npm -v

      - name: Install dependencies (npm ci — strict, lockfile-pinned)
        run: npm ci
        env:
          HUSKY: '0'

      - name: Validate lockfile is in sync
        run: npm run validate:lock

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build renderer (Vite)
        run: npm run build

      - name: Freeze Colony Auto Count sidecar (Windows)
        run: npm run build:colony-backend

      # Icons are gitignored (public/icon.ico etc.). CI invokes electron-builder
      # directly, so npm's predist:win lifecycle never runs — generate explicitly.
      - name: Generate platform icons
        run: npm run generate-icons

      - name: Confirm Windows icon.ico exists
        shell: bash
        run: |
          set -euo pipefail
          ls -la public/
          test -f public/icon.ico
          # electron-builder resolves win.icon relative to project dir (forward slashes OK on Windows)
          node -e "const fs=require('fs'); const p='public/icon.ico'; if(!fs.existsSync(p)) process.exit(1); console.log('icon.ico OK', fs.statSync(p).size, 'bytes')"

      - name: Package Windows installer
        run: npx electron-builder --win --publish never

      - name: Verify Windows installer exists
        shell: bash
        run: npm run verify:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - build-mac
      - build-win
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts

      - name: List artifacts
        run: find dist-artifacts -type f | sort

      - name: Publish release (installers only — no raw .app / source zips)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Lab Tools ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist-artifacts/mac-dmg/*.dmg
            dist-artifacts/win-installer/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
